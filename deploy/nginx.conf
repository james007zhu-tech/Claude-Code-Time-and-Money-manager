# 时间账本：只提供应用文件；HTTPS 由 Cloudflare 负责
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # 不对外提供 .git、tests、deploy 等内部文件
    location ~ /\.                                  { return 404; }
    location ~ ^/(tests|deploy|node_modules)(/|$)   { return 404; }
    location ~ ^/(package\.json|CNAME)$             { return 404; }

    # 应用清单：单独指定类型（在 server 里写 types 会覆盖 nginx 自带的全部类型）
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 入口页和 Service Worker 不缓存，更新后马上生效
    location ~ ^/(index\.html|sw\.js)?$ {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri =404;
    }
}
