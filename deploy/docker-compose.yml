# 时间账本 · 用 Cloudflare Tunnel 发布到 https://finance.zhu.com.ai
#   1. 在 Cloudflare 后台建好隧道，把令牌写进同目录的 .env：TUNNEL_TOKEN=xxxx
#   2. docker compose up -d
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 不映射端口：只有同一网络里的 cloudflared 能访问

  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?请在 deploy/.env 里填 TUNNEL_TOKEN}
    depends_on:
      - web
